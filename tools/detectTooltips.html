<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tooltip Cropper - DetectTooltips</title>
<script src="detectTooltips.js"></script>
<style>
  body { font: 14px sans-serif; margin: 12px; }
  fieldset { margin: 0 0 10px; }
  label { margin-right: 14px; white-space: nowrap; }
  table { border-collapse: collapse; } th, td { padding: 2px 8px; text-align: center; } td input[type=number] { width: 56px; }
  #drop { border: 2px dashed #888; padding: 14px; margin-bottom: 10px; text-align: center; color: #555; }
  #drop.over { background: #eef; }
  #status { margin: 8px 0; font-family: monospace; }
  .wrap { position: relative; display: inline-block; max-width: 100%; border: 1px solid #ccc; }
  .wrap canvas { display: block; max-width: 100%; height: auto; }
  #ov { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  #results { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
  .item { padding: 8px; border: 1px solid #ccc; }
  .item .bg { display: inline-block; padding: 8px; }
  .item canvas { display: block; }
  .bg-checker { background: #fff linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%) 0 0/16px 16px,
                linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%) 8px 8px/16px 16px; }
  .bg-white { background: #fff; } .bg-black { background: #000; }
  .bg-green { background: #3a8a3a; } .bg-blue { background: #3a6fc0; }
</style>
</head>
<body>

<div id="drop">画像をドロップ / Ctrl+V で貼り付け / <input type="file" id="file" accept="image/*"></div>

<fieldset>
  <legend>設定</legend>
  <table>
    <tr><th></th><th colspan="2">外枠(1本目)</th><th colspan="2">内枠(2本目)</th></tr>
    <tr><th>辺</th><th>色</th><th>許容差</th><th>色</th><th>許容差</th></tr>
    <tr><th>上辺</th>
      <td><input type="color" id="A_top" value="#232B34"></td><td><input type="number" id="tA_top" value="80" min="0" max="255"></td>
      <td><input type="color" id="B_top" value="#6C8693"></td><td><input type="number" id="tB_top" value="80" min="0" max="255"></td></tr>
    <tr><th>下辺</th>
      <td><input type="color" id="A_bottom" value="#232B34"></td><td><input type="number" id="tA_bottom" value="80" min="0" max="255"></td>
      <td><input type="color" id="B_bottom" value="#47525A"></td><td><input type="number" id="tB_bottom" value="80" min="0" max="255"></td></tr>
    <tr><th>左辺</th>
      <td><input type="color" id="A_left" value="#232B34"></td><td><input type="number" id="tA_left" value="80" min="0" max="255"></td>
      <td><input type="color" id="B_left" value="#47525A"></td><td><input type="number" id="tB_left" value="80" min="0" max="255"></td></tr>
    <tr><th>右辺</th>
      <td><input type="color" id="A_right" value="#232B34"></td><td><input type="number" id="tA_right" value="80" min="0" max="255"></td>
      <td><input type="color" id="B_right" value="#47525A"></td><td><input type="number" id="tB_right" value="80" min="0" max="255"></td></tr>
  </table>
  <p>
  <label>内枠の突出(本体より明るい量) <input type="range" id="peak" min="0" max="30" value="5"> <span id="peakv">5</span></label>
  <label>最小辺長 <input type="number" id="minLen" value="200" min="10" style="width:60px"></label>
  <label>辺の最小連続率(%) <input type="number" id="cover" value="80" min="30" max="100" style="width:60px"></label>
  <label>表示背景
    <select id="bgsel">
      <option value="checker">市松</option>
      <option value="white">白</option>
      <option value="black">黒</option>
      <option value="green">緑</option>
      <option value="blue">青</option>
    </select>
  </label>
  <label><input type="checkbox" id="dbg" checked> 辺の候補を表示(水色=上辺 / 桃色=下辺 / 橙=左辺 / 黄緑=右辺)と不採用の理由</label>
  </p>
</fieldset>

<p>
  <button id="cap" type="button">画面キャプチャ開始</button>
  <label>更新間隔(ms) <input type="number" id="interval" value="100" min="0" step="50" style="width:70px"></label>
  <small>画面・ウィンドウ・タブを共有すると、その映像にツールチップの枠(赤)を重ねて表示します</small>
</p>

<div id="status">画像を読み込んでください</div>
<pre id="why" style="font-size:12px;margin:4px 0; height:200px;overflow:auto;display:none"></pre>

<div class="wrap">
  <canvas id="src"></canvas>
  <canvas id="ov"></canvas>
</div>
<div id="results"></div>

<script>
const $ = id => document.getElementById(id);
const src = $('src'), sctx = src.getContext('2d', { willReadFrequently: true });
const ov = $('ov'), octx = ov.getContext('2d');
let bmp = null, capturing = false, stream = null, vid = null, lastT = 0;

function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

function detectNow(debug) {
  const t0 = performance.now();
  const W = src.width, H = src.height;
  const d = sctx.getImageData(0, 0, W, H).data;
  const sides = ['top', 'bottom', 'left', 'right'].map(k => ({
    a: hex2rgb($('A_' + k).value), tolA: +$('tA_' + k).value,
    b: hex2rgb($('B_' + k).value), tolB: +$('tB_' + k).value
  }));
  const res = DetectTooltips.run(d, W, H, { sides, peak: +$('peak').value, minLen: +$('minLen').value || 200,
    cover: (+$('cover').value || 80) / 100, debug });
  return { res, ms: performance.now() - t0, W, H };
}

/*
  // src: Canvas;
  // sctx: src.getContext('2d', { willReadFrequently: true });
  // キャプチャの場合はCanvasの縦横をキャプチャに合わせて描画
    const W = vid.videoWidth, H = vid.videoHeight;
    if (src.width !== W || src.height !== H) { src.width = ov.width = W; src.height = ov.height = H; }
    sctx.drawImage(vid, 0, 0);
  
  const W = src.width, H = src.height;
  const d = sctx.getImageData(0, 0, W, H).data;
  const sides = ['top', 'bottom', 'left', 'right'].map(k => ({
    a: [35, 43, 52], // 外枠の色(共通)
    b: (k == "top" ? [108, 134, 147] : [71, 82, 90]), // 内枠の色(topのみ異なる)
    tolA: 80, // 閾値
    tolB: 50,
  }));
  const peak = 5;
  const minLen = 200;
  const cover = 80 / 100;
  const debug = false;
  const res = DetectTooltips.run(d, W, H, {sides, peak, minLen, cover, debug});
  console.log(res.rects); // rects.x, y, w, h
*/

function run() {
  if (!bmp || capturing) return;   // キャプチャ中は毎フレーム最新の設定で検出するので何もしない
  const { res, ms, W, H } = detectNow($('dbg').checked);
  const rects = res.rects;

  octx.clearRect(0, 0, ov.width, ov.height);
  const lw = Math.max(1, W / 600);
  const why = $('why');
  if ($('dbg').checked) {
    octx.lineWidth = lw;
    const hline = (r, c) => { octx.strokeStyle = c; octx.beginPath(); octx.moveTo(r.s, r.y + 0.5); octx.lineTo(r.e + 1, r.y + 0.5); octx.stroke(); };
    const vline = (r, c) => { octx.strokeStyle = c; octx.beginPath(); octx.moveTo(r.x + 0.5, r.s); octx.lineTo(r.x + 0.5, r.e + 1); octx.stroke(); };
    res.tops.forEach(r => hline(r, 'cyan'));      res.bots.forEach(r => hline(r, 'magenta'));
    res.lefts.forEach(r => vline(r, 'orange'));   res.rights.forEach(r => vline(r, 'lime'));
    why.style.display = 'block';
    why.textContent = `候補: 上辺 ${res.tops.length} / 下辺 ${res.bots.length} / 左辺 ${res.lefts.length} / 右辺 ${res.rights.length}\n` +
      (res.log.length ? res.log.join('\n') : '(上辺候補がありません)');
  } else why.style.display = 'none';
  octx.strokeStyle = 'red'; octx.lineWidth = lw;
  const box = $('results'); box.innerHTML = '';
  rects.forEach((r, i) => {
    octx.strokeRect(r.x - 0.5, r.y - 0.5, r.w + 1, r.h + 1);
    const c = document.createElement('canvas');
    c.width = r.w; c.height = r.h;
    c.getContext('2d').drawImage(bmp, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
    const item = document.createElement('div'); item.className = 'item';
    const bgdiv = document.createElement('div'); bgdiv.className = 'bg bg-' + $('bgsel').value;
    bgdiv.appendChild(c);
    const a = document.createElement('a');
    a.textContent = 'PNG保存'; a.href = '#';
    a.onclick = e => { e.preventDefault(); c.toBlob(b => {
      const u = URL.createObjectURL(b), l = document.createElement('a');
      l.href = u; l.download = `tooltip_${i + 1}.png`; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000);
    }); };
    item.append(bgdiv, document.createElement('br'), `#${i + 1}  x=${r.x} y=${r.y} ${r.w}x${r.h}  `, a);
    box.appendChild(item);
  });
  $('status').textContent = `${W}x${H} / 検出 ${rects.length} 件 / ${ms.toFixed(1)} ms` +
    (rects.length ? '' : '  (辺ごとの外枠・内枠の色と許容差を調整、または「辺の候補を表示」で確認してください)');
}

function loadBlob(blob) {
  createImageBitmap(blob).then(b => {
    bmp = b;
    src.width = ov.width = b.width; src.height = ov.height = b.height;
    sctx.clearRect(0, 0, b.width, b.height);
    sctx.drawImage(b, 0, 0);
    run();
  });
}

// ---- 画面キャプチャ: 共有した画面/ウィンドウ/タブの映像に、検出したツールチップの枠を重ねて表示 ----
async function startCapture() {
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
  } catch (e) {
    $('status').textContent = '画面キャプチャを開始できませんでした: ' + (e.message || e.name);
    return;
  }
  vid = document.createElement('video');
  vid.muted = true; vid.playsInline = true; vid.srcObject = stream;
  try { await vid.play(); } catch (e) { /* 映像が来れば frame() 側で処理される */ }
  capturing = true;
  $('cap').textContent = 'キャプチャ停止';
  $('results').innerHTML = ''; $('why').style.display = 'none';
  stream.getVideoTracks()[0].addEventListener('ended', stopCapture);   // ブラウザ側の「共有を停止」でも止める
  lastT = 0;
  requestAnimationFrame(frame);
}

async function stopCapture() {
  if (!capturing) return;
  capturing = false;
  stream.getTracks().forEach(t => t.stop());
  vid.srcObject = null;
  $('cap').textContent = '画面キャプチャ開始';
  if (src.width) { bmp = await createImageBitmap(src); run(); }   // 最後のフレームを静止画にして通常の切り抜き表示へ
}

function frame(now) {
  if (!capturing) return;
  if (vid.videoWidth && now - lastT >= (+$('interval').value || 0)) {
    lastT = now;
    const W = vid.videoWidth, H = vid.videoHeight;
    if (src.width !== W || src.height !== H) { src.width = ov.width = W; src.height = ov.height = H; }
    sctx.drawImage(vid, 0, 0);
    const debug = $('dbg').checked;
    const { res, ms } = detectNow(debug);
    octx.clearRect(0, 0, W, H);
    const lw = Math.max(2, W / 500);
    if (debug) {
      // 静止画モードと同じ色で辺候補を表示
      octx.lineWidth = lw;
      const hline = (r, c) => { octx.strokeStyle = c; octx.beginPath(); octx.moveTo(r.s, r.y + 0.5); octx.lineTo(r.e + 1, r.y + 0.5); octx.stroke(); };
      const vline = (r, c) => { octx.strokeStyle = c; octx.beginPath(); octx.moveTo(r.x + 0.5, r.s); octx.lineTo(r.x + 0.5, r.e + 1); octx.stroke(); };
      res.tops.forEach(r => hline(r, 'cyan'));
      res.bots.forEach(r => hline(r, 'magenta'));
      res.lefts.forEach(r => vline(r, 'orange'));
      res.rights.forEach(r => vline(r, 'lime'));
      const why = $('why');
      why.style.display = 'block';
      why.textContent = `候補: 上辺 ${res.tops.length} / 下辺 ${res.bots.length} / 左辺 ${res.lefts.length} / 右辺 ${res.rights.length}\n` +
        (res.log.length ? res.log.join('\n') : '(上辺候補がありません)');
    } else {
      $('why').style.display = 'none';
    }
    // 候補線の上に、採用された矩形を赤枠で重ねる
    octx.strokeStyle = 'red'; octx.lineWidth = lw;
    res.rects.forEach(r => octx.strokeRect(r.x - 0.5, r.y - 0.5, r.w + 1, r.h + 1));
    $('status').textContent = `キャプチャ中 ${W}x${H} / 検出 ${res.rects.length} 件 / ${ms.toFixed(1)} ms` +
      (debug ? ' / 辺候補表示中' : '');
  }
  requestAnimationFrame(frame);
}
$('cap').onclick = () => capturing ? stopCapture() : startCapture();

$('file').onchange = e => e.target.files[0] && loadBlob(e.target.files[0]);
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && loadBlob(e.dataTransfer.files[0]); };
document.addEventListener('paste', e => {
  for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) { loadBlob(it.getAsFile()); break; }
});
document.querySelectorAll('table input').forEach(el => el.oninput = run);
$('minLen').onchange = run; $('cover').onchange = run; $('dbg').onchange = run;
$('peak').oninput = () => { $('peakv').textContent = $('peak').value; run(); };
$('bgsel').onchange = () => document.querySelectorAll('.item .bg').forEach(el => el.className = 'bg bg-' + $('bgsel').value);
</script>
</body>
</html>
